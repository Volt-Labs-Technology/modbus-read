[package]
name = "modbus-read"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Read-only Modbus TCP client. Only the two read function codes exist, so it cannot write to a device."
repository = "https://github.com/Volt-Labs-Technology/modbus-read"
homepage = "https://github.com/Volt-Labs-Technology/modbus-read"
documentation = "https://docs.rs/modbus-read"
readme = "README.md"
license = "MIT"
keywords = ["modbus", "tcp", "registers", "industrial", "scada"]
categories = ["network-programming"]

[dependencies]
thiserror = "2"

[features]
# A loopback Modbus TCP device for tests and examples. It opens a socket.
test-server = []

[package.metadata.docs.rs]
features = ["test-server"]

[[example]]
name = "read_two_registers"
required-features = ["test-server"]
